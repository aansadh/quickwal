services:
  postgres:
    image: postgres:17
    container_name: quickwal-db
    environment:
      POSTGRES_DB: quickwal
      POSTGRES_USER: quickwal
      POSTGRES_PASSWORD: quickwalsecret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2G


  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: quickwal-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: quickwal-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "QuickWal-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    depends_on:
      - kafka


  redis:
    image: redis:7-alpine
    container_name: quickwal-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: