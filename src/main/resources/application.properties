spring.application.name=QuickWal
spring.datasource.url=jdbc:postgresql://localhost:5433/quickwal
spring.datasource.username=quickwal
spring.datasource.password=${QUICKWAL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Use virtual threads for Spring Boot-managed task execution and web requests.
spring.threads.virtual.enabled=true
# Keep the JVM alive when scheduled work runs on daemon virtual threads.
spring.main.keep-alive=true

spring.liquibase.change-log=classpath:db.changelog/db.changelog-master.yaml
spring.config.import=classpath:application.kafka.properties
